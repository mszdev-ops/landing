<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04050d">
<title>szabolcsmihalyi.com</title>
<style>
  :root{--bg:#04050d;--cyan:#3ef2ff;--mag:#ff3ec8}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden;cursor:crosshair;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .fx{position:fixed;inset:0;pointer-events:none}
  .scan{background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
  .vig{background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.8) 100%)}
  .prompt{position:fixed;left:50%;bottom:clamp(22px,6vh,56px);transform:translateX(-50%);
    font:500 14px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    color:rgba(200,245,255,.6);letter-spacing:.06em;white-space:nowrap;pointer-events:none;user-select:none;
    opacity:0;animation:in 2s 1.2s forwards;text-shadow:0 0 10px rgba(62,242,255,.35)}
  .prompt i{font-style:normal;color:var(--mag);margin-right:.6em;text-shadow:0 0 10px var(--mag)}
  .prompt b{display:inline-block;width:.6em;height:1.05em;vertical-align:-.17em;background:var(--cyan);
    box-shadow:0 0 12px var(--cyan);margin-left:.15em;animation:blink 1.05s steps(1) infinite}
  .cover{position:fixed;inset:0;background:var(--bg);pointer-events:none;animation:out 1.8s .15s forwards}
  @keyframes blink{50%{opacity:0}}
  @keyframes in{to{opacity:1}}
  @keyframes out{to{opacity:0;visibility:hidden}}
  @media (max-width:600px){.prompt{font-size:12px}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="fx scan"></div>
<div class="fx vig"></div>
<div class="prompt"><i>❯</i><span id="t"></span><b></b></div>
<div class="cover"></div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = 'ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace';

  let W, H, DPR, F, cx, cy, bgGrad;
  const GY = 5, NEAR = 0.4, GZ = 90;
  const O = { x: 0, y: -0.6, z: 16 };     // a központi objektum helye
  let R = 3.2;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    F = Math.hypot(W, H) * 0.5;
    cx = W / 2; cy = H / 2;
    R = W < H ? 3.8 : 3.2;
    bgGrad = ctx.createRadialGradient(cx, cy * 0.85, 0, cx, cy, Math.max(W, H) * 0.8);
    bgGrad.addColorStop(0, '#0b0e24');
    bgGrad.addColorStop(0.55, '#06071a');
    bgGrad.addColorStop(1, '#030409');
    buildParticles();
    if (typeof buildWord === 'function') buildWord();
  }

  /* ---------- kamera ---------- */
  let mx = 0.5, my = 0.5, camX = 0, camY = 0, yaw = 0, pitch = 0;
  let cyw = 1, syw = 0, cp = 1, sp = 0;
  function tr(x, y, z) {
    x -= camX; y -= camY;
    const x1 = x * cyw - z * syw, z1 = x * syw + z * cyw;
    return [x1, y * cp - z1 * sp, y * sp + z1 * cp];
  }
  function clipLine(a, b) {
    if (a[2] < NEAR && b[2] < NEAR) return null;
    if (a[2] < NEAR) { const k = (NEAR - a[2]) / (b[2] - a[2]); a = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, NEAR]; }
    else if (b[2] < NEAR) { const k = (NEAR - b[2]) / (a[2] - b[2]); b = [b[0] + (a[0] - b[0]) * k, b[1] + (a[1] - b[1]) * k, NEAR]; }
    const pa = F / a[2], pb = F / b[2];
    return [cx + a[0] * pa, cy + a[1] * pa, cx + b[0] * pb, cy + b[1] * pb, a[2], b[2]];
  }

  /* ---------- kód-glifek ---------- */
  const TOK = ['{', '}', '</>', '=>', '()', '[]', ';', '0', '1', '0', '1', 'fn', 'if', '&&', '||', '!=', '++',
               '#', '$', '//', '::', '0x', 'λ', 'let', 'nil', '<>', '*', '%', '?:', '===', 'def', '#!', '~/', '{}'];
  const COLS = ['#3ef2ff', '#3ef2ff', '#ff3ec8', '#9d7bff', '#e8fbff'];
  const sprites = [];
  function sprite(txt, col) {
    const fs = 48, m = document.createElement('canvas').getContext('2d');
    m.font = `600 ${fs}px ${FONT}`;
    const w = Math.ceil(m.measureText(txt).width) + 28, h = fs + 28;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.font = m.font; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = col; g.shadowBlur = 12; g.fillStyle = col;
    g.fillText(txt, w / 2, h / 2);
    g.shadowBlur = 0; g.fillText(txt, w / 2, h / 2);
    return { c, w, h, col };
  }
  for (const t of TOK) for (const c of COLS) sprites.push(sprite(t, c));

  let P = [];
  function spawn(p, far) {
    p.x = (Math.random() * 2 - 1) * 32;
    p.y = (Math.random() * 2 - 1) * 16 - 2;
    p.z = far ? GZ - Math.random() * 12 : 1 + Math.random() * (GZ - 1);
    p.s = sprites[(Math.random() * sprites.length) | 0];
    p.o = 0.45 + Math.random() * 0.55;
    p.sz = 0.55 + Math.random() * 0.9;
    return p;
  }
  function buildParticles() {
    const n = W < 700 ? 230 : 420;
    P = []; for (let i = 0; i < n; i++) P.push(spawn({}, false));
  }

  /* ---------- geodéziai ikozaéder ---------- */
  const g = (1 + Math.sqrt(5)) / 2;
  let V = [[-1,g,0],[1,g,0],[-1,-g,0],[1,-g,0],[0,-1,g],[0,1,g],[0,-1,-g],[0,1,-g],[g,0,-1],[g,0,1],[-g,0,-1],[-g,0,1]];
  let Fc = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
            [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const norm = v => { const l = Math.hypot(v[0], v[1], v[2]); return [v[0] / l, v[1] / l, v[2] / l]; };
  V = V.map(norm);
  { const cache = {}, nf = [];
    const mid = (a, b) => { const k = a < b ? a + '_' + b : b + '_' + a;
      if (cache[k] !== undefined) return cache[k];
      V.push(norm([(V[a][0] + V[b][0]) / 2, (V[a][1] + V[b][1]) / 2, (V[a][2] + V[b][2]) / 2]));
      return cache[k] = V.length - 1; };
    for (const [a, b, c] of Fc) { const ab = mid(a, b), bc = mid(b, c), ca = mid(c, a);
      nf.push([a, ab, ca], [b, bc, ab], [c, ca, bc], [ab, bc, ca]); }
    Fc = nf; }
  const E = []; { const s = new Set();
    for (const [a, b, c] of Fc) for (const [u, v] of [[a, b], [b, c], [c, a]]) {
      const k = u < v ? u + '_' + v : v + '_' + u; if (!s.has(k)) { s.add(k); E.push([u, v]); } } }
  const phase = V.map(() => Math.random() * Math.PI * 2);

  /* ---------- domain felirat részecskékből ---------- */
  const DOMAIN = 'szabolcsmihalyi.com';
  const WZ = 10.5;                                   // a felirat mélysége (a gömb előtt)
  const FIRST = 3.5, CYCLE = 17, FORM = 2.4, HOLD = 3.8, BURST = 1.8;
  let WP = [], WDOT = 0.05, lastCycle = -1, burstDone = false;

  function buildWord() {
    const portrait = W / H < 1.1;
    const parts = portrait ? ['szabolcs', 'mihalyi.com'] : [DOMAIN];
    const fs = 140, lh = fs * 1.08;
    const m = document.createElement('canvas'), g2 = m.getContext('2d');
    g2.font = `700 ${fs}px ${FONT}`;
    const tw = Math.ceil(Math.max(...parts.map(p => g2.measureText(p).width))) + 20;
    const th = Math.ceil(lh * parts.length) + 20;
    m.width = tw; m.height = th;
    g2.font = `700 ${fs}px ${FONT}`; g2.textAlign = 'center'; g2.textBaseline = 'middle'; g2.fillStyle = '#fff';
    parts.forEach((p, i) => g2.fillText(p, tw / 2, 10 + lh * (i + 0.5)));
    const data = g2.getImageData(0, 0, tw, th).data;
    let filled = 0; for (let i = 3; i < data.length; i += 4) if (data[i] > 128) filled++;
    const want = W < 700 ? 700 : 1200;
    const gap = Math.max(2, Math.sqrt(filled / want));
    const worldW = (portrait ? 0.86 : 0.72) * W * WZ / F;
    const sc = worldW / tw;
    WDOT = sc * gap * 0.55;
    const pts = [];
    for (let y = 0; y < th; y += gap) for (let x = 0; x < tw; x += gap) {
      if (data[((y | 0) * tw + (x | 0)) * 4 + 3] > 128) pts.push([(x - tw / 2) * sc, (y - th / 2) * sc]);
    }
    WP = pts.map(([x, y]) => ({
      tx: O.x + x, ty: O.y + y, tz: WZ + (Math.random() - 0.5) * 0.15,
      sx: 0, sy: 0, sz: 0, vx: 0, vy: 0, vz: 0,
      d: Math.random() * 0.7, ph: Math.random() * 6.2832, c: Math.random() < 0.16 ? 1 : 0
    }));
    lastCycle = -1;
  }

  const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

  function drawWord() {
    if (!WP.length || t < FIRST) return;
    const cyc = Math.floor((t - FIRST) / CYCLE), lt = (t - FIRST) - cyc * CYCLE;
    if (lt > FORM + HOLD + BURST) return;

    if (cyc !== lastCycle) {                       // új ciklus: a részecskék a mélyből indulnak
      lastCycle = cyc; burstDone = false;
      for (const p of WP) {
        p.sx = (Math.random() * 2 - 1) * 30; p.sy = (Math.random() * 2 - 1) * 14 - 2; p.sz = 45 + Math.random() * 45;
      }
    }
    const inBurst = lt > FORM + HOLD;
    if (inBurst && !burstDone) {                   // szétrobbanás
      burstDone = true; pulse = 1;
      for (const p of WP) {
        const dx = p.tx - O.x, dy = p.ty - O.y;
        p.vx = dx * (0.6 + Math.random() * 0.8) + (Math.random() - 0.5) * 4;
        p.vy = dy * (0.6 + Math.random() * 0.8) + (Math.random() - 0.5) * 4;
        p.vz = -(3 + Math.random() * 9);
      }
    }

    for (const p of WP) {
      let x, y, z, a;
      if (lt < FORM) {
        const k = Math.max(0, Math.min(1, (lt - p.d) / (FORM - 0.7))), e = easeInOut(k), sw = (1 - e) * 2.5;
        x = p.sx + (p.tx - p.sx) * e + Math.cos(p.ph + lt * 3) * sw;
        y = p.sy + (p.ty - p.sy) * e + Math.sin(p.ph + lt * 3) * sw;
        z = p.sz + (p.tz - p.sz) * e;
        a = Math.min(1, k * 2.5);
      } else if (!inBurst) {
        x = p.tx + Math.sin(t * 2.3 + p.ph) * 0.02;
        y = p.ty + Math.cos(t * 1.9 + p.ph) * 0.02;
        z = p.tz;
        a = 0.75 + 0.25 * Math.sin(t * 4 + p.ph * 2);
      } else {
        const lb = lt - FORM - HOLD;
        x = p.tx + p.vx * lb; y = p.ty + p.vy * lb; z = p.tz + p.vz * lb;
        a = Math.max(0, 1 - lb / BURST);
      }
      const q = tr(x, y, z); if (q[2] < NEAR || a <= 0.01) continue;
      const s = F / q[2], px = cx + q[0] * s, py = cy + q[1] * s, d = Math.max(1, s * WDOT);
      ctx.fillStyle = p.c ? '#ff3ec8' : '#7ff6ff';
      ctx.globalAlpha = a * 0.18;
      ctx.fillRect(px - d * 1.6, py - d * 1.6, d * 3.2, d * 3.2);
      ctx.fillStyle = p.c ? '#ff8ee0' : '#e8fdff';
      ctx.globalAlpha = a;
      ctx.fillRect(px - d / 2, py - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- interakció ---------- */
  let warp = false, pulse = 0, lastPointer = 0;
  addEventListener('pointermove', e => { mx = e.clientX / W; my = e.clientY / H; lastPointer = performance.now(); });
  addEventListener('pointerdown', e => { mx = e.clientX / W; my = e.clientY / H; warp = true; pulse = 1; });
  addEventListener('pointerup', () => warp = false);
  addEventListener('pointercancel', () => warp = false);
  addEventListener('blur', () => warp = false);
  addEventListener('keydown', e => { if (e.code === 'Space') { warp = true; if (!e.repeat) pulse = 1; } });
  addEventListener('keyup', e => { if (e.code === 'Space') warp = false; });
  addEventListener('deviceorientation', e => {
    if (e.gamma == null || performance.now() - lastPointer < 3000) return;
    mx = 0.5 + Math.max(-1, Math.min(1, e.gamma / 35)) * 0.5;
    my = 0.5 + Math.max(-1, Math.min(1, (e.beta - 45) / 35)) * 0.5;
  });
  addEventListener('resize', resize);

  /* ---------- gépelő prompt ---------- */
  const lines = ['hello, world', 'while (true) { create(); }', 'git commit -m "∞"', 'sudo make magic',
                 'import universe', 'render --dimensions=3', 'whoami', 'echo $CURIOSITY', 'npm run dreams',
                 'cd ~/szabolcsmihalyi.com', 'ping 127.0.0.1'];
  const tEl = document.getElementById('t');
  let li = 0;
  (function typeLoop() {
    const s = lines[li % lines.length]; let i = 0;
    const type = () => { tEl.textContent = s.slice(0, ++i);
      if (i < s.length) setTimeout(type, 45 + Math.random() * 70); else setTimeout(del, 2200); };
    const del = () => { tEl.textContent = s.slice(0, --i);
      if (i > 0) setTimeout(del, 22); else { li++; setTimeout(typeLoop, 500); } };
    setTimeout(type, 2200);
  })();

  /* ---------- rajzolás ---------- */
  let last = performance.now(), t = 0, speed = 1, off = 0;

  function drawGlyph(p) {
    const q = tr(p.x, p.y, p.z);
    if (q[2] < NEAR) return;
    const s = F / q[2], x = cx + q[0] * s, y = cy + q[1] * s;
    if (x < -150 || x > W + 150 || y < -150 || y > H + 150) return;
    const a = Math.min(1, (GZ - p.z) / 18) * Math.min(1, (q[2] - NEAR) / 2.5);
    if (a <= 0.01) return;
    const k = s / 48 * p.sz;
    if (speed > 1.6) {
      const r = tr(p.x, p.y, p.z + (speed - 1) * 1.4);
      if (r[2] > NEAR) {
        const s2 = F / r[2];
        ctx.globalAlpha = a * 0.45 * Math.min(1, speed - 1.6);
        ctx.strokeStyle = p.s.col; ctx.lineWidth = Math.max(0.7, k * 6);
        ctx.beginPath(); ctx.moveTo(cx + r[0] * s2, cy + r[1] * s2); ctx.lineTo(x, y); ctx.stroke();
      }
    }
    ctx.globalAlpha = a * p.o;
    const dw = p.s.w * k, dh = p.s.h * k;
    ctx.drawImage(p.s.c, x - dw / 2, y - dh / 2, dw, dh);
  }

  function drawGrid() {
    const hz = tr(0, GY, 4000); const hy = cy + hz[1] * (F / hz[2]);
    const band = ctx.createLinearGradient(0, hy - H * 0.22, 0, hy + H * 0.12);
    band.addColorStop(0, 'rgba(255,62,200,0)');
    band.addColorStop(0.65, `rgba(255,62,200,${0.13 + pulse * 0.08})`);
    band.addColorStop(1, 'rgba(255,62,200,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = band; ctx.fillRect(0, hy - H * 0.22, W, H * 0.34);

    ctx.lineWidth = 1;
    for (let x = -45; x <= 45; x += 3) {
      const L = clipLine(tr(x, GY, 0), tr(x, GY, GZ)); if (!L) continue;
      const gr = ctx.createLinearGradient(L[0], L[1], L[2], L[3]);
      gr.addColorStop(0, 'rgba(255,62,200,.55)'); gr.addColorStop(1, 'rgba(255,62,200,0)');
      ctx.strokeStyle = gr; ctx.beginPath(); ctx.moveTo(L[0], L[1]); ctx.lineTo(L[2], L[3]); ctx.stroke();
    }
    const step = 3;
    for (let z = step - (off % step); z < GZ; z += step) {
      const L = clipLine(tr(-45, GY, z), tr(45, GY, z)); if (!L) continue;
      const f = 1 - z / GZ;
      ctx.strokeStyle = `rgba(255,90,210,${f * f * 0.6})`;
      ctx.beginPath(); ctx.moveTo(L[0], L[1]); ctx.lineTo(L[2], L[3]); ctx.stroke();
    }
  }

  function drawObject() {
    const ax = t * 0.21, ay = t * 0.33;
    const cax = Math.cos(ax), sax = Math.sin(ax), cay = Math.cos(ay), say = Math.sin(ay);
    const pts = new Array(V.length), lz = new Array(V.length);
    for (let i = 0; i < V.length; i++) {
      const r = R * (1 + 0.05 * Math.sin(t * 1.8 + phase[i]) + pulse * 0.18 * Math.sin(phase[i] * 3));
      let [x, y, z] = V[i]; x *= r; y *= r; z *= r;
      let y1 = y * cax - z * sax, z1 = y * sax + z * cax;
      let x2 = x * cay + z1 * say, z2 = -x * say + z1 * cay;
      lz[i] = z2;
      const q = tr(O.x + x2, O.y + y1, O.z + z2);
      const s = F / Math.max(q[2], NEAR);
      pts[i] = [cx + q[0] * s, cy + q[1] * s, s];
    }
    const c = tr(O.x, O.y, O.z), cs = F / Math.max(c[2], NEAR);
    const pcx = cx + c[0] * cs, pcy = cy + c[1] * cs, rad = R * cs;

    // belső mag
    const core = ctx.createRadialGradient(pcx, pcy, 0, pcx, pcy, rad * 1.9);
    core.addColorStop(0, `rgba(62,242,255,${0.28 + 0.08 * Math.sin(t * 2.2) + pulse * 0.3})`);
    core.addColorStop(0.35, 'rgba(120,90,255,.10)');
    core.addColorStop(1, 'rgba(62,242,255,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = core;
    ctx.fillRect(pcx - rad * 2, pcy - rad * 2, rad * 4, rad * 4);

    // hátsó élek
    ctx.beginPath();
    for (const [a, b] of E) if (lz[a] + lz[b] > 0) { ctx.moveTo(pts[a][0], pts[a][1]); ctx.lineTo(pts[b][0], pts[b][1]); }
    ctx.strokeStyle = 'rgba(255,62,200,.28)'; ctx.lineWidth = 1; ctx.stroke();
    // első élek
    ctx.beginPath();
    for (const [a, b] of E) if (lz[a] + lz[b] <= 0) { ctx.moveTo(pts[a][0], pts[a][1]); ctx.lineTo(pts[b][0], pts[b][1]); }
    ctx.strokeStyle = 'rgba(62,242,255,.85)'; ctx.lineWidth = 1.3;
    ctx.shadowColor = '#3ef2ff'; ctx.shadowBlur = 14; ctx.stroke(); ctx.shadowBlur = 0;
    // csúcsok
    for (let i = 0; i < V.length; i++) {
      const front = lz[i] <= 0;
      ctx.globalAlpha = front ? 1 : 0.35;
      ctx.fillStyle = front ? '#e8fbff' : '#ff3ec8';
      const r = Math.max(1, pts[i][2] * (front ? 0.06 : 0.04));
      ctx.beginPath(); ctx.arc(pts[i][0], pts[i][1], r, 0, 6.2832); ctx.fill();
    }

    // keringő gyűrűk
    const rings = [[1.15, 0.45, R * 1.65, '#3ef2ff'], [-0.6, -0.3, R * 2.05, '#9d7bff']];
    for (const [tilt, spin, rr, col] of rings) {
      const ct = Math.cos(tilt), st = Math.sin(tilt), so = t * spin;
      ctx.fillStyle = col;
      for (let i = 0; i < 90; i++) {
        const a = i / 90 * 6.2832 + so;
        let x = Math.cos(a) * rr, z = Math.sin(a) * rr;
        let y = -z * st; z = z * ct;
        const q = tr(O.x + x, O.y + y, O.z + z); if (q[2] < NEAR) continue;
        const s = F / q[2];
        ctx.globalAlpha = (z < 0 ? 0.9 : 0.3) * (0.4 + 0.6 * ((i % 6) === 0));
        const d = Math.max(0.8, s * (i % 6 === 0 ? 0.05 : 0.025));
        ctx.fillRect(cx + q[0] * s - d / 2, cy + q[1] * s - d / 2, d, d);
      }
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    t += dt * (reduce ? 0.35 : 1);

    const target = reduce ? 0.25 : (warp ? 7 : 1);
    speed += (target - speed) * Math.min(1, dt * (warp ? 2.2 : 1.6));
    pulse = Math.max(0, pulse - dt * 1.4);
    off += 6 * speed * dt;

    // kamera + parallax
    const tx = (mx - 0.5) * 4.2 + Math.sin(t * 0.13) * 0.8;
    const ty = Math.min(1.5, (my - 0.5) * 2.2 + Math.sin(t * 0.17) * 0.3);
    camX += (tx - camX) * Math.min(1, dt * 2.5);
    camY += (ty - camY) * Math.min(1, dt * 2.5);
    yaw = Math.atan((camX - O.x) / O.z) * 0.85 + Math.sin(t * 0.11) * 0.02;
    pitch = -Math.atan((O.y - camY) / O.z) * 0.85;
    cyw = Math.cos(yaw); syw = Math.sin(yaw); cp = Math.cos(pitch); sp = Math.sin(pitch);

    // háttér
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    drawGrid();

    const v = 7 * speed * dt;
    for (const p of P) { p.z -= v; if (p.z < 0.2) spawn(p, true); }
    for (const p of P) if (p.z >= O.z) drawGlyph(p);
    drawObject();
    for (const p of P) if (p.z < O.z) drawGlyph(p);
    drawWord();

    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
